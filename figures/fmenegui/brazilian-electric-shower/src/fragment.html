<div id="electric-shower-cutaway-3">
  <style>
    #electric-shower-cutaway-3 {
      --anatomy-paper: var(--background);
      --anatomy-face: var(--background);
      --anatomy-top: color-mix(in srgb, var(--background) 98%, var(--foreground));
      --anatomy-shade-0: color-mix(in srgb, var(--background) 76%, var(--foreground));
      --anatomy-shade-1: color-mix(in srgb, var(--background) 83%, var(--foreground));
      --anatomy-shade-2: color-mix(in srgb, var(--background) 89%, var(--foreground));
      --anatomy-shade-3: color-mix(in srgb, var(--background) 94%, var(--foreground));
      --anatomy-hi: color-mix(in srgb, var(--foreground) 75%, var(--background));
      --anatomy-mid: color-mix(in srgb, var(--foreground) 56%, var(--background));
      --anatomy-lo: color-mix(in srgb, var(--foreground) 36%, var(--background));
      --anatomy-faint: color-mix(in srgb, var(--foreground) 18%, var(--background));
      --anatomy-dot: var(--foreground);
      --anatomy-lit: var(--foreground);
      --anatomy-lit-top: var(--background);
      --anatomy-lit-shade: var(--muted);
      --anatomy-weight: .75px;
      color: var(--foreground);
    }
    #electric-shower-cutaway-3 .sh-head {display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
    #electric-shower-cutaway-3 .sh-head h3 {margin:0}
    #electric-shower-cutaway-3 .sh-view {position:relative;margin:4px 0}
    #electric-shower-cutaway-3 .sh-svg {display:block;width:100%;height:auto;overflow:hidden}
    #electric-shower-cutaway-3 .sh-actions {display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:12px}
    #electric-shower-cutaway-3 .sh-settings {display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
    #electric-shower-cutaway-3 .sh-status {margin-left:auto}
    #electric-shower-cutaway-3 .sh-legend {display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:10px}
    #electric-shower-cutaway-3 .sh-legend span {display:inline-flex;gap:6px;align-items:center}
    #electric-shower-cutaway-3 .sh-swatch {width:14px;height:3px;background:var(--blue)}
    #electric-shower-cutaway-3 .sh-swatch-heat {background:var(--orange)}
    #electric-shower-cutaway-3 .sh-hole {fill:var(--anatomy-shade-0);stroke:var(--anatomy-mid);stroke-width:.5}
    #electric-shower-cutaway-3 .sh-spray {fill:none;stroke:url(#sh3-jet-fade);stroke-width:.7}
    #electric-shower-cutaway-3 .sh-droplet {fill:none;stroke:var(--blue);stroke-linecap:round;stroke-width:1.5;opacity:.6}
    #electric-shower-cutaway-3 .sh-flow-track {fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;opacity:.13}
    #electric-shower-cutaway-3 .sh-tracer {fill:var(--blue);opacity:.8}
    /* KIT_CSS */
    #electric-shower-cutaway-3 .sh-svg {overflow:hidden}
    #electric-shower-cutaway-3 [data-part="heater-a"] .tb-body,
    #electric-shower-cutaway-3 [data-part="heater-b"] .tb-body {fill:var(--anatomy-shade-0)}
    #electric-shower-cutaway-3 .sh-energized .tb-body {fill:var(--orange)}
    #electric-shower-cutaway-3 .sh-energized .tb-shine {fill:color-mix(in srgb,var(--orange) 42%,var(--background))}
    #electric-shower-cutaway-3 .sh-energized .tb-shade {fill:color-mix(in srgb,var(--orange) 82%,var(--foreground))}
    #electric-shower-cutaway-3 .sh-energized .iso-line {stroke:var(--orange)}
    #electric-shower-cutaway-3 [data-part="membrane"] [data-dome] {--anatomy-shade-0:color-mix(in srgb,var(--foreground) 24%,var(--background));--anatomy-shade-1:color-mix(in srgb,var(--foreground) 20%,var(--background));--anatomy-shade-2:color-mix(in srgb,var(--foreground) 16%,var(--background));--anatomy-shade-3:color-mix(in srgb,var(--foreground) 12%,var(--background))}
    #electric-shower-cutaway-3 [data-name*="moving-pad"] .iso-top,
    #electric-shower-cutaway-3 [data-name*="fixed-pad"] .iso-face {fill:var(--anatomy-hi)}
    @media(max-width:460px) {#electric-shower-cutaway-3 .sh-status {margin-left:0;flex-basis:100%}}
  </style>
  <div class="sh-head">
    <h3>Inside a Brazilian electric shower</h3>
    <span class="text-small text-muted">Working cutaway</span>
  </div>
  <div class="viz-row" role="group" aria-label="View the same shower up close">
    <button class="btn btn-ghost" type="button" data-focus="whole" aria-pressed="true">Whole shower</button>
    <button class="btn btn-ghost" type="button" data-focus="switch" aria-pressed="false">Diaphragm &amp; contacts</button>
    <button class="btn btn-ghost" type="button" data-focus="heater" aria-pressed="false">Heating element</button>
  </div>
  <div class="sh-view">
    <!-- GEOMETRY -->
  </div>
  <div class="sh-actions" role="group" aria-label="Operate the water tap">
    <button class="btn btn-primary" type="button" id="sh3-tap" aria-pressed="false">Open tap</button>
    <button class="btn" type="button" id="sh3-replay">Replay opening</button>
    <span id="sh3-phase" class="sh-status text-small" aria-live="polite">Contacts open · heater off</span>
  </div>
  <div class="viz-controls sh-settings">
    <label class="form-label" for="sh3-mode">Heat setting
      <select class="form-select" id="sh3-mode">
        <option value="cold">Cold</option>
        <option value="summer">Summer</option>
        <option value="winter" selected>Winter</option>
      </select>
    </label>
  </div>
  <div class="sh-legend text-small">
    <span><i class="sh-swatch" aria-hidden="true"></i>Water flow</span>
    <span><i class="sh-swatch sh-swatch-heat" aria-hidden="true"></i>Active heating element</span>
  </div>
  <script>
    (() => {
      /* RUNTIME */
    })()
  </script>
</div>
